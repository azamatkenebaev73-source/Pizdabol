<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Китаеза ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ffd6e0);
        }

        .card {
            width: 85%;
            max-width: 380px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .photo {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        h1 {
            color: #e91e63;
            margin: 10px 0;
        }

        p {
            font-size: 18px;
            margin: 10px;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.95);
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 20px;
            color: #e91e63;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="124988.jpg" class="photo">

        <h1>Китаеза ❤️</h1>

        <p>🇨🇳 Тру Китаеза </p>
        <p>❤️ Любит китайцев </p>
        <p>✨ Самая кринжовая </p>

        <button onclick="showLove()">
            Нажми сюда ❤️
        </button>

        <div id="message">
            С любовью, твой любимый брат ❤️
        </div>

    </div>

    <script>
        function showLove() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
