<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нажми кнопку</title>
<style>
:root{
  --bg:#fff1f5;--ink:#2a0a17;--btn:#e8184f;--btn-ink:#fff;--shadow:#8f0e32;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d0711;--ink:#ffe3ec;--btn:#ff3d74;--btn-ink:#26030f;--shadow:#8f1c3e}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Rubik","Segoe UI",Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
main{width:100%;max-width:560px}
#go{position:absolute;opacity:0;pointer-events:none}
.btn{
  display:inline-block;cursor:pointer;user-select:none;
  background:var(--btn);color:var(--btn-ink);
  font-size:clamp(22px,6vw,32px);font-weight:700;
  padding:22px 44px;border-radius:999px;
  box-shadow:0 8px 0 var(--shadow);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--shadow)}
#go:focus-visible+.btn{outline:4px solid var(--ink);outline-offset:6px}
.msg{
  margin-top:48px;font-weight:800;
  font-size:clamp(40px,13vw,88px);line-height:1.05;
  display:none;
}
.msg small{display:block;font-size:.7em;margin-top:12px}
#go:checked~.msg{display:block;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#go:checked+.btn{background:transparent;color:var(--btn);box-shadow:inset 0 0 0 4px var(--btn)}
#go:checked+.btn span:first-child{display:none}
.btn span:last-child{display:none}
#go:checked+.btn span:last-child{display:inline}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#go:checked~.msg{animation:none}}
</style>
</head>
<body>
<main>
  <input type="checkbox" id="go">
  <label class="btn" for="go"><span>Нажми меня</span><span>Ещё раз?</span></label>
  <p class="msg">Прочитал Гей <small>😘</small></p>
</main>
</body>
</html>
